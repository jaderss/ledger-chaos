name: Chaos

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    name: ${{ matrix.mode }}${{ matrix.locking && format(' ({0})', matrix.locking) || '' }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: correct, scenario: all, interval: 8s, fault: 3s }
          - { mode: correct, locking: serializable, scenario: all, interval: 8s, fault: 3s }
          - { mode: correct, scenario: db-latency, interval: 12s, fault: 8s }
          - { mode: no-idempotency, scenario: db-latency, interval: 12s, fault: 8s }
          - { mode: dual-write, scenario: kafka-down, interval: 8s, fault: 3s }
          - { mode: unordered-locks, scenario: contention, interval: 8s, fault: 3s }
          - { mode: read-modify-write, scenario: contention, interval: 8s, fault: 3s }
    steps:
      - uses: actions/checkout@v7
      - name: Run
        run: >-
          make chaos MODE=${{ matrix.mode }} SCENARIO=${{ matrix.scenario }} DURATION=60s
          FAULT_INTERVAL=${{ matrix.interval }} FAULT_DURATION=${{ matrix.fault }} RUN_ID=ci
          LEDGER_LOCKING=${{ matrix.locking || 'ordered' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mode }}-${{ matrix.locking || 'ordered' }}-${{ matrix.scenario }}
          path: results/ci
      - if: always()
        run: make down
