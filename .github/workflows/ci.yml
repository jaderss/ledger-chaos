name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Java build, tests, format and coverage
        working-directory: services
        run: ./mvnw -B verify dependency:copy-dependencies -DincludeScope=compile
      - name: Infrastructure through Toxiproxy
        run: make up
      - name: Go vet, tests and coverage
        run: |
          for m in chaos; do
            docker run --rm -v "$PWD/$m":/src -w /src golang:1.27 sh -c 'test -z "$(gofmt -l .)" && go vet ./...' || exit 1
          done
          make test-go
      - name: Report lint
        run: docker run --rm -v "$PWD/report":/app -w /app node:26-slim sh -c 'npm ci --ignore-scripts && npm run lint'
      - name: Images build
        run: docker compose --profile tools build ledger relay projector chaos checker report
      - name: SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - if: always()
        run: make down
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
