name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres, Kafka and Toxiproxy
        run: make up
      - name: Postgres and Kafka answer through Toxiproxy
        run: |
          docker run --rm --network ledger-chaos_default -e PGPASSWORD="$LEDGER_DB_PASSWORD" postgres:"$POSTGRES_VERSION" \
            psql -h toxiproxy -p 15432 -U ledger -d ledger -tAc 'select 1'
          docker run --rm --network ledger-chaos_default apache/kafka:"$KAFKA_VERSION" \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server toxiproxy:19092 --list | grep -qx ledger.transfers
        env:
          POSTGRES_VERSION: '18.6'
          KAFKA_VERSION: '4.4.0'
          LEDGER_DB_PASSWORD: ledger
      - if: always()
        run: make down

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, test, format and coverage
        working-directory: services
        run: ./mvnw -B verify dependency:copy-dependencies -DincludeScope=compile
      - name: Service images build
        run: docker compose build ledger relay projector
      - name: SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
