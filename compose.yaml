name: ledger-chaos

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  db-init:
    image: flyway/flyway:${FLYWAY_VERSION:-12.4.0}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_PLACEHOLDERS_LEDGERPASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
      FLYWAY_PLACEHOLDERS_RELAYPASSWORD: ${RELAY_DB_PASSWORD:-relay}
      FLYWAY_PLACEHOLDERS_PROJECTORPASSWORD: ${PROJECTOR_DB_PASSWORD:-projector}
      FLYWAY_PLACEHOLDERS_STATEMENTTIMEOUT: ${STATEMENT_TIMEOUT:-2s}
      FLYWAY_PLACEHOLDERS_IDLEINTXTIMEOUT: ${IDLE_IN_TX_TIMEOUT:-10s}
    volumes:
      - ./infra/postgres/migrations:/flyway/migrations:ro
    restart: "no"

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093,INTERNAL://:29092,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: CLIENT://toxiproxy:19092,INTERNAL://kafka:29092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  kafka-topics:
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ledger.transfers --partitions ${TOPIC_PARTITIONS:-6} --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ledger.transfers.DLT --partitions 1 --replication-factor 1
    restart: "no"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:${TOXIPROXY_VERSION:-2.13.0}
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["8474:8474", "15432:15432", "19092:19092"]

  ledger:
    build:
      context: services
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
        MODULE: ledger
    image: ledger-chaos/ledger
    depends_on:
      toxiproxy:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEMORY_MB:-1536}m
    environment:
      DB_HOST: toxiproxy
      DB_PORT: 15432
      DB_SOCKET_TIMEOUT_S: ${DB_SOCKET_TIMEOUT_S:-5}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
      POOL_SIZE: ${POOL_SIZE:-20}
      LEDGER_MODE: ${LEDGER_MODE:-correct}
      LEDGER_LOCKING: ${LEDGER_LOCKING:-ordered}
      JAVA_OPTS: -XX:+Use${JVM_GC:-ParallelGC} -XX:MaxRAMPercentage=${HEAP_PERCENT:-75}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 2s
      timeout: 2s
      retries: 60

  relay:
    build:
      context: services
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
        MODULE: relay
    image: ledger-chaos/relay
    depends_on:
      ledger:
        condition: service_healthy
    cpus: 1
    mem_limit: 768m
    environment:
      DB_HOST: toxiproxy
      DB_PORT: 15432
      DB_SOCKET_TIMEOUT_S: ${DB_SOCKET_TIMEOUT_S:-5}
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:-relay}
      KAFKA_BOOTSTRAP: toxiproxy:19092
      RELAY_BATCH: ${RELAY_BATCH:-100}
      RELAY_INTERVAL: ${RELAY_INTERVAL:-50ms}
      IDLE_IN_TX_TIMEOUT: ${IDLE_IN_TX_TIMEOUT:-10s}
      KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-5000}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-3000}
      KAFKA_MAX_BLOCK_MS: ${KAFKA_MAX_BLOCK_MS:-3000}
      JAVA_OPTS: -XX:+Use${JVM_GC:-ParallelGC} -XX:MaxRAMPercentage=${HEAP_PERCENT:-75}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 2s
      timeout: 2s
      retries: 60

  projector:
    build:
      context: services
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
        MODULE: projector
    image: ledger-chaos/projector
    depends_on:
      toxiproxy:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 768m
    environment:
      DB_HOST: toxiproxy
      DB_PORT: 15432
      DB_SOCKET_TIMEOUT_S: ${DB_SOCKET_TIMEOUT_S:-5}
      PROJECTOR_DB_PASSWORD: ${PROJECTOR_DB_PASSWORD:-projector}
      KAFKA_BOOTSTRAP: toxiproxy:19092
      PROJECTOR_CONCURRENCY: ${PROJECTOR_CONCURRENCY:-3}
      KAFKA_SESSION_TIMEOUT_MS: ${KAFKA_SESSION_TIMEOUT_MS:-10000}
      JAVA_OPTS: -XX:+Use${JVM_GC:-ParallelGC} -XX:MaxRAMPercentage=${HEAP_PERCENT:-75}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 2s
      timeout: 2s
      retries: 60
