name: ledger-chaos

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:-relay}
      PROJECTOR_DB_PASSWORD: ${PROJECTOR_DB_PASSWORD:-projector}
      STATEMENT_TIMEOUT: ${STATEMENT_TIMEOUT:-2s}
      IDLE_IN_TX_TIMEOUT: ${IDLE_IN_TX_TIMEOUT:-10s}
    volumes:
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger && pg_isready -U postgres -d projector"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093,INTERNAL://:29092,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: CLIENT://toxiproxy:19092,INTERNAL://kafka:29092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  kafka-topics:
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ledger.transfers --partitions ${TOPIC_PARTITIONS:-6} --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ledger.transfers.DLT --partitions 1 --replication-factor 1
    restart: "no"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:${TOXIPROXY_VERSION:-2.13.0}
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["8474:8474", "15432:15432", "19092:19092"]
