spring:
  application:
    name: relay
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ledger?socketTimeout=${DB_SOCKET_TIMEOUT_S:5}
    username: relay
    password: ${RELAY_DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

relay:
  topic: ledger.transfers
  batch: ${RELAY_BATCH:100}
  interval: ${RELAY_INTERVAL:50ms}
  idle-in-transaction-timeout: ${IDLE_IN_TX_TIMEOUT:10s}
  kafka:
    max-block: ${KAFKA_MAX_BLOCK_MS:3000}ms
    request-timeout: ${KAFKA_REQUEST_TIMEOUT_MS:3000}ms
    delivery-timeout: ${KAFKA_DELIVERY_TIMEOUT_MS:5000}ms

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
