spring:
  application:
    name: projector
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/projector?socketTimeout=${DB_SOCKET_TIMEOUT_S:5}
    username: projector
    password: ${PROJECTOR_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PROJECTOR_CONCURRENCY:3}
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:10000}
        heartbeat.interval.ms: 3000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate
      concurrency: ${PROJECTOR_CONCURRENCY:3}

projector:
  topic: ledger.transfers
  dlt: ledger.transfers.DLT
  group: projector

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
