spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ledger?socketTimeout=${DB_SOCKET_TIMEOUT_S:5}
    username: ledger
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${POOL_SIZE:20}
      connection-timeout: 3000

ledger:
  mode: ${LEDGER_MODE:correct}
  locking: ${LEDGER_LOCKING:ordered}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
