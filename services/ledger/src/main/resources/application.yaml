spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ledger?socketTimeout=${DB_SOCKET_TIMEOUT_S:5}
    username: ledger
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${POOL_SIZE:20}
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:3000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:5000}

ledger:
  mode: ${LEDGER_MODE:correct}
  locking: ${LEDGER_LOCKING:ordered}
  topic: ledger.transfers

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
